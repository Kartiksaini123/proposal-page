<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Question For You</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body {
    height:100vh; width:100vw; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg, #ffe6f0, #ffd1dc);
  }

  /* PAGE 1 */
  #proposalPage {
    text-align:center; padding:30px;
  }
  #proposalPage h1 {
    font-size: 2.2rem;
    color:#d6336c;
    margin-bottom: 30px;
  }
  .btn {
    padding:14px 30px;
    margin:10px;
    font-size:1.1rem;
    border:none;
    border-radius:30px;
    cursor:pointer;
    font-weight:bold;
  }
  #yesBtn {
    background:#d6336c;
    color:white;
    transition: transform 0.2s;
  }
  #yesBtn:hover { transform: scale(1.1); }
  #noBtn {
    background:#fff;
    color:#d6336c;
    border:2px solid #d6336c;
    position:relative;
  }

  /* PAGE 2 */
  #yesPage {
    display:none;
    text-align:center;
    padding:40px;
    max-width:600px;
    background:rgba(255,255,255,0.85);
    border-radius:20px;
    box-shadow:0 10px 40px rgba(214,51,108,0.3);
  }
  #yesPage h1 {
    font-size:2.5rem;
    color:#d6336c;
    margin-bottom:20px;
  }
  #yesPage p {
    font-size:1.2rem;
    color:#444;
    line-height:1.6;
    margin-bottom:10px;
  }
  .roses { font-size:2rem; margin:20px 0; letter-spacing:10px; }

  /* Falling petals */
  .petal {
    position:fixed;
    top:-10px;
    font-size:1.5rem;
    pointer-events:none;
    animation: fall linear infinite;
    z-index:0;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); opacity:0.3; }
  }

 /* 📱 Mobile Responsive */
@media (max-width: 768px) {

  #proposalPage {
    padding: 20px;
  }

  #proposalPage h1 {
    font-size: 1.6rem;
    margin-bottom: 20px;
  }

  .btn {
    padding: 12px 22px;
    font-size: 1rem;
    display: block;
    width: 80%;
    margin: 10px auto;
  }

  #yesPage {
    padding: 20px;
    margin: 15px;
    max-width: 90%;
  }

  #yesPage h1 {
    font-size: 1.8rem;
  }

  #yesPage p {
    font-size: 1rem;
  }

  .roses {
    font-size: 1.5rem;
    letter-spacing: 5px;
  }

  .petal {
    font-size: 1.2rem;
  }
}
</style>
</head>
<body>

<div id="proposalPage">
  <h1>Will you be mine? 💖</h1>
  <button id="yesBtn" class="btn">Yes 💕</button>
  <button id="noBtn" class="btn">No</button>
</div>

<div id="yesPage">
  <div class="roses">🌹🌹🌹🌹🌹</div>
  <h1>Yay! She said Yes! 🥰</h1>
  <p>Every moment with you feels like a beautiful story I never want to end.</p>
  <p>You are my favorite person, my happiest thought, and my best decision.</p>
  <p>Thank you for saying yes — let's create a thousand more memories together. 💞</p>
  <div class="roses">🌹🌹🌹🌹🌹</div>
</div>

<script>
const yesBtn = document.getElementById('yesBtn');
const noBtn = document.getElementById('noBtn');
const proposalPage = document.getElementById('proposalPage');
const yesPage = document.getElementById('yesPage');

// Move "No" button away on hover/click
function moveNoButton() {
  const x = Math.random() * (window.innerWidth - 120);
  const y = Math.random() * (window.innerHeight - 60);
  noBtn.style.position = 'fixed';
  noBtn.style.left = x + 'px';
  noBtn.style.top = y + 'px';
}
noBtn.addEventListener('mouseover', moveNoButton);
noBtn.addEventListener('click', (e) => {
  e.preventDefault();
  moveNoButton();
});

yesBtn.addEventListener('click', () => {
  proposalPage.style.display = 'none';
  yesPage.style.display = 'block';
  startPetals();
});

function startPetals() {
  setInterval(() => {
    const petal = document.createElement('div');
    petal.className = 'petal';
    petal.textContent = '🌸';
    petal.style.left = Math.random() * 100 + 'vw';
    petal.style.animationDuration = (Math.random()*3 + 4) + 's';
    petal.style.fontSize = (Math.random()*1 + 1) + 'rem';
    document.body.appendChild(petal);
    setTimeout(() => petal.remove(), 7000);
  }, 400);
}
</script>

</body>
</html>
